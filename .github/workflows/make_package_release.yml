name: Create Subfolder Release

on:
  push:
    tags:
      - 'release-*'

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Get tag and release name
      id: get_tag
      run: |
        echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        echo "RELEASE_NAME=${GITHUB_REF#refs/tags/release-}" >> $GITHUB_ENV

    - name: Configure Git
      run: |
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions Bot"

    - name: Extract Subfolder and Push Branch
      run: |
          git subtree split --prefix=Assets/com.edia.eye -b release-branch-$RELEASE_NAME
          git push -f origin release-branch-$RELEASE_NAME

    - name: Tag the commit
      run: |
        git tag "${RELEASE_NAME}"
        git push origin "${RELEASE_NAME}"

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$RELEASE_NAME" --title "Release $RELEASE_NAME" --target release-branch-$RELEASE_NAME

